version: 2
updates:
  - package-ecosystem: "npm"
    target-branch: "main"
    directory: "/StreamAwesome"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Dependency"
    cooldown:
      default-days: 2
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Dependency"
    cooldown:
      default-days: 2
